<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Loom Framing</title>
<script>
/* Conserva lo que venga (fbclid, ttclid, utm_content=clipNN) y estampa la fuente
   del puente solo si no viene una propia. Va ANTES del meta a proposito: el meta
   redirige a URL fija y a 0s le gana la carrera si queda arriba. */
(function(){
  var p = new URLSearchParams(location.search);
  if (!p.has('utm_source')) {
    p.set('utm_source','instagram'); p.set('utm_medium','bio'); p.set('utm_campaign','iman');
  }
  location.replace('/guias/el-framero-completo.html?' + p.toString() + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0;url=/guias/el-framero-completo.html?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=iman">
<link rel="canonical" href="https://loomframing.com/guias/el-framero-completo.html">
<style>
  :root{--slate-900:#14110d;--line:#3a332a;--cream:#f4ecd7;--cream-dim:#c9c0ad;--orange:#ff6d00;--orange-ink:#14110d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--slate-900);color:var(--cream);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  main{max-width:360px;width:100%;text-align:center}
  .eyebrow{font-size:11px;letter-spacing:1px;color:var(--orange);text-transform:uppercase;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace}
  h1{font-size:28px;letter-spacing:0.5px;line-height:1.05;text-transform:uppercase;margin:10px 0 8px}
  p{color:var(--cream-dim);font-size:15px;margin-bottom:22px}
  a.btn{display:block;padding:16px;border-radius:12px;background:var(--orange);color:var(--orange-ink);font-weight:700;font-size:17px;letter-spacing:0.5px;text-transform:uppercase;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Loom Framing</p>
  <h1>Ya vas pa' allá</h1>
  <p>Si no te movió solo, éntrale aquí.</p>
  <a class="btn" href="/guias/el-framero-completo.html?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=iman">Bajar la hoja gratis</a>
</main>
</body>
</html>
